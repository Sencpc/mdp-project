<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal" x-data="adminApp()">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <div class="w-64 bg-gray-900 text-white flex flex-col shadow-lg">
            <div class="p-6">
                <h1 class="text-2xl font-bold">Admin Panel</h1>
                <p class="text-sm text-gray-400 mt-1">Manage your database</p>
            </div>
            <nav class="flex-1 px-4 space-y-2">
                <button @click="tab = 'users'" :class="tab === 'users' ? 'bg-gray-800' : 'hover:bg-gray-800'" class="w-full text-left px-4 py-3 rounded-lg font-medium transition-colors">
                    Users
                </button>
                <button @click="tab = 'doctors'" :class="tab === 'doctors' ? 'bg-gray-800' : 'hover:bg-gray-800'" class="w-full text-left px-4 py-3 rounded-lg font-medium transition-colors">
                    Doctors
                </button>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col h-screen overflow-y-auto">
            
            <!-- Header -->
            <header class="bg-white shadow px-8 py-5">
                <h2 class="text-xl font-semibold text-gray-800" x-text="tab === 'users' ? 'User Management' : 'Doctor Management'"></h2>
            </header>

            <!-- Content Area -->
            <main class="p-8">
                
                <!-- USERS TAB -->
                <div x-show="tab === 'users'">
                    <div class="bg-white rounded-lg shadow overflow-hidden">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Username</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Full Name</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                <template x-for="user in users" :key="user.id">
                                    <tr>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" x-text="user.id"></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" x-text="user.username"></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="user.fullName"></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                            <button @click="deleteUser(user.id)" class="text-red-600 hover:text-red-900">Delete</button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                        <div x-show="users.length === 0" class="p-6 text-center text-gray-500">No users found.</div>
                    </div>
                </div>

                <!-- DOCTORS TAB -->
                <div x-show="tab === 'doctors'" style="display: none;">
                    
                    <!-- Create Doctor Form -->
                    <div class="bg-white rounded-lg shadow p-6 mb-8">
                        <h3 class="text-lg font-medium text-gray-900 mb-4">Add New Doctor</h3>
                        <form @submit.prevent="createDoctor" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="block text-sm font-medium text-gray-700">Name</label><input x-model="newDoctor.name" required type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2"></div>
                            <div><label class="block text-sm font-medium text-gray-700">Category</label><input x-model="newDoctor.category" required type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2"></div>
                            <div><label class="block text-sm font-medium text-gray-700">Rating (0-5)</label><input x-model="newDoctor.rating" required type="number" step="0.1" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2"></div>
                            <div><label class="block text-sm font-medium text-gray-700">Experience</label><input x-model="newDoctor.experience" required type="text" placeholder="e.g. 10 years" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2"></div>
                            <div class="md:col-span-2"><label class="block text-sm font-medium text-gray-700">Description</label><textarea x-model="newDoctor.description" rows="2" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2"></textarea></div>
                            <div><label class="block text-sm font-medium text-gray-700">Price (IDR)</label><input x-model="newDoctor.price" required type="number" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2"></div>
                            <div><label class="block text-sm font-medium text-gray-700">Profile Icon URL</label><input x-model="newDoctor.profileIcon" required type="text" value="https://via.placeholder.com/150" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2"></div>
                            <div class="md:col-span-2 mt-2">
                                <button type="submit" class="bg-gray-900 text-white px-4 py-2 rounded-md hover:bg-gray-800 transition-colors">Save Doctor</button>
                            </div>
                        </form>
                    </div>

                    <!-- Doctors Table -->
                    <div class="bg-white rounded-lg shadow overflow-hidden">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Category</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Price</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                <template x-for="doc in doctors" :key="doc.id">
                                    <tr>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" x-text="doc.id"></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" x-text="doc.name"></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="doc.category"></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="'Rp ' + doc.price"></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                            <button @click="deleteDoctor(doc.id)" class="text-red-600 hover:text-red-900">Delete</button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                        <div x-show="doctors.length === 0" class="p-6 text-center text-gray-500">No doctors found.</div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('adminApp', () => ({
                tab: 'users',
                users: [],
                doctors: [],
                newDoctor: {
                    name: '', category: '', rating: '', experience: '', description: '', price: '', profileIcon: 'https://via.placeholder.com/150'
                },

                init() {
                    this.fetchUsers();
                    this.fetchDoctors();
                    this.$watch('tab', value => {
                        if(value === 'users') this.fetchUsers();
                        if(value === 'doctors') this.fetchDoctors();
                    });
                },

                async fetchUsers() {
                    const res = await fetch('/admin/api/users');
                    this.users = await res.json();
                },

                async deleteUser(id) {
                    if(confirm('Are you sure you want to delete this user?')) {
                        await fetch('/admin/api/users/' + id, { method: 'DELETE' });
                        this.fetchUsers();
                    }
                },

                async fetchDoctors() {
                    const res = await fetch('/admin/api/doctors');
                    this.doctors = await res.json();
                },

                async createDoctor() {
                    await fetch('/admin/api/doctors', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.newDoctor)
                    });
                    this.newDoctor = { name: '', category: '', rating: '', experience: '', description: '', price: '', profileIcon: 'https://via.placeholder.com/150' };
                    this.fetchDoctors();
                },

                async deleteDoctor(id) {
                    if(confirm('Are you sure you want to delete this doctor?')) {
                        await fetch('/admin/api/doctors/' + id, { method: 'DELETE' });
                        this.fetchDoctors();
                    }
                }
            }))
        })
    </script>
</body>
</html>
